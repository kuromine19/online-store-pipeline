# Local demo: Airflow 3 (standalone mode) + PostgreSQL for both Airflow metadata and the warehouse.
# Start:  docker compose up -d      UI: http://localhost:8090 (no login, local demo only)
# Ports can be changed in .env (AIRFLOW_PORT, WAREHOUSE_PORT).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-warehouse.sql:/docker-entrypoint-initdb.d/init-warehouse.sql:ro
    ports:
      - "${WAREHOUSE_PORT:-5433}:5432"   # query the warehouse from your machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20

  # One-off step: makes the folders Airflow writes to writable by the Airflow user,
  # whatever user owns the project folder on your machine.
  fix-permissions:
    image: apache/airflow:3.3.2
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/data/landing /opt/airflow/docs/data
        chown -R ${AIRFLOW_UID:-50000}:0 /opt/airflow/data
        chmod 777 /opt/airflow/docs/data
    volumes:
      - landing:/opt/airflow/data
      - ./docs/data:/opt/airflow/docs/data

  airflow:
    image: apache/airflow:3.3.2
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      fix-permissions:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # Local demo only: disables the login screen. Never use this on a shared server.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # Fixed secrets so the scheduler and API server sign and verify task tokens with the same key.
      # Without them each component generates its own key and tasks fail with "Invalid auth token".
      AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_JWT_SECRET:-local-demo-jwt-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}"
      AIRFLOW__API__SECRET_KEY: "${AIRFLOW_API_SECRET_KEY:-local-demo-api-secret-change-me-0123456789abcdefghijklmnopqrstuvwxyz}"
      PYTHONPATH: /opt/airflow
      WAREHOUSE_URL: postgresql+psycopg2://warehouse:warehouse@postgres:5432/warehouse
      LANDING_DIR: /opt/airflow/data/landing
      SITE_DATA_DIR: /opt/airflow/docs/data
    volumes:
      - ./dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - landing:/opt/airflow/data            # synthetic source files, kept inside Docker
      - ./docs/data:/opt/airflow/docs/data   # dashboard JSON, written back to the repo
    ports:
      - "${AIRFLOW_PORT:-8090}:8080"   # Airflow listens on 8080 inside the container

volumes:
  pgdata:
  landing:
